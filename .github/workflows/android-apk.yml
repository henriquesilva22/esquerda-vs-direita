# Gera o APK de Android a cada envio para a branch main e publica em "Releases".
# Link fixo para baixar no celular: https://github.com/<usuário>/<repositório>/releases/latest/download/EsquerdaVsDireita.apk
name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # o runner ubuntu-latest já vem com o Android SDK (ANDROID_HOME); o Gradle baixa o que faltar
      - name: Conferir Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Montar o jogo (www/)
        run: node scripts/build-www.mjs

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Ícones e splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0c0912' --iconBackgroundColorDark '#0c0912' --splashBackgroundColor '#0c0912' --splashBackgroundColorDark '#0c0912'

      - name: Só horizontal + versão do build
        run: |
          node scripts/configure-native.mjs
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        run: |
          mkdir -p ~/.android
          cp android-config/debug.keystore ~/.android/debug.keystore
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../EsquerdaVsDireita.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Esquerda vs Direita 1.0.${{ github.run_number }} (Android)
          make_latest: true
          files: EsquerdaVsDireita.apk
          body: |
            APK de teste do jogo **Esquerda vs Direita** para Android.

            **Como instalar no celular**
            1. Abra este link no celular e toque em `EsquerdaVsDireita.apk` para baixar.
            2. Abra o arquivo baixado. Se o Android pedir, permita "instalar apps desta fonte".
            3. Toque em Instalar e abra o jogo.

            Build de teste assinado com a chave de depuração; para a Google Play use um build de release com a sua própria chave.
