# Publica a versão web (jogável e instalável pelo navegador, funciona sem internet) no GitHub Pages.
# Endereço: https://<usuário>.github.io/<repositório>/
name: Site (GitHub Pages)

# Roda depois que o APK fica pronto, para o site já levar o APK novo na página de download.
on:
  workflow_run:
    workflows: ["APK Android"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Montar a versão web
        run: node scripts/build-www.mjs --web site
      - name: Incluir o APK na página de download
        run: |
          git fetch --depth 1 origin apk
          git show origin/apk:EsquerdaVsDireita.apk > site/EsquerdaVsDireita.apk
          ls -la site/EsquerdaVsDireita.apk
      # O GitHub Pages precisa estar ligado uma vez em Settings → Pages → Source: "GitHub Actions"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
