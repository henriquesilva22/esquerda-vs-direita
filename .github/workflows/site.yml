# Publica a versão web (jogável e instalável pelo navegador, funciona sem internet) no GitHub Pages.
# Endereço: https://<usuário>.github.io/<repositório>/
name: Site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Montar a versão web
        run: node scripts/build-www.mjs --web site
      # O GitHub Pages precisa estar ligado uma vez em Settings → Pages → Source: "GitHub Actions"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
